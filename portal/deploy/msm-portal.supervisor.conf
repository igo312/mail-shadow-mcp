; mail-shadow-mcp hosting portal -- supervisor program
;
; Install:
;   sudo cp portal/deploy/msm-portal.supervisor.conf /etc/supervisor/conf.d/msm-portal.conf
;   sudo editor /etc/supervisor/conf.d/msm-portal.conf    # edit the placeholders
;   sudo mkdir -p /var/lib/msm-portal
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status msm-portal
;
; Supervisor does NOT expand shell variables in this file.  Replace every
; placeholder (paths, IP, port) with the real value before enabling it.
;
; No pip install is needed: the portal uses only the Python standard library.
; Point `command` at any Python >= 3.10; the project is tested on 3.10/3.12/3.14.
;
; The portal controls Docker through the Docker socket, which is equivalent to
; root on the host, so running this program as root grants no extra power.  To
; use a dedicated user instead, add it to the `docker` group, set user=/group=
; below, and make sure it can write MSM_DATA_DIR.
;
; Behind Caddy/Nginx: bind MSM_LISTEN_HOST to 127.0.0.1 and add
; MSM_TRUST_PROXY="1" to the environment block.

[program:msm-portal]
command=/usr/bin/python3.12 -m app
directory=/opt/mail-shadow-mcp/portal
user=root

environment=
    MSM_DATA_DIR="/var/lib/msm-portal",
    MSM_PUBLIC_URL="http://203.0.113.10:60001",
    MSM_LISTEN_HOST="0.0.0.0",
    MSM_LISTEN_PORT="60001",
    MSM_SECURE_COOKIES="0",
    MSM_BACKEND_MODE="port",
    MSM_IMAGE="ghcr.io/dryas/mail-shadow-mcp:latest",
    MSM_MAX_INSTANCES="25",
    MSM_LOG_LEVEL="INFO",
    PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    PYTHONUNBUFFERED="1",
    LANG="C.UTF-8"

autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/msm-portal.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; The log can contain email addresses and the first-run invite code.
umask=0077
